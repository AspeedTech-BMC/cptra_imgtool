[package]
name = "cptra-imgtool"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
p384.workspace = true
serde.workspace = true
serde_derive.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
zerocopy.workspace = true
tempfile.workspace = true
once_cell.workspace = true
memoffset.workspace = true
colored.workspace = true

[workspace]
members = [
  "tools/cptra_2x/auth-manifest/app",
  "tools/cptra_2x/auth-manifest/gen",
  "tools/cptra_2x/auth-manifest/types",
]

[workspace.dependencies]
anyhow = "=1.0.102"
clap = { version = "=4.5.60", default-features = false, features = ["std"] }
env_logger = "=0.11.9"
log = "=0.4.29"
p384 = { version = "=0.13.1", features = ["ecdsa"] }
serde = "=1.0.228"
serde_derive = "=1.0.228"
sha2 = "=0.10.9"
hex = "=0.4.3"
toml = "=0.7.8"
zerocopy = { version = "=0.8.40", features = ["derive"] }
tempfile = "=3.26.0"
once_cell = "=1.21.3"
memoffset = "=0.9.1"
colored = "=2.2.0"
chrono = "=0.4.44"
bitflags = "=2.10.0"
arbitrary = { version = "=1.4.2", features = ["derive"] }
bitfield = "=0.14.0"
zeroize = { version = "=1.8.2", default-features = false, features = ["zeroize_derive"] }
openssl = { version = "=0.10.72", features = ["vendored"] }

caliptra-auth-man-gen = {path = "tools/cptra_2x/auth-manifest/gen", default-features = false}
caliptra-auth-man-types = {path = "tools/cptra_2x/auth-manifest/types", default-features = false}

caliptra-drivers = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35"}
caliptra-error = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35", default-features = false}
caliptra-image-crypto = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35"}
caliptra-image-elf = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35"}
caliptra-image-fake-keys = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35"}
caliptra-image-gen = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35"}
caliptra-image-serde = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35"}
caliptra-image-types = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35", default-features = false}
caliptra-lms-types = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "879608b901cc60a68f4e52441e3c494605d08f35"}

[patch.crates-io]
# Fork of https://github.com/teythoon/rust-openssl.git/justus/pqc
openssl = { git = "https://github.com/clundin25/rust-openssl.git", rev = "4ada1c1d7c264e052e7bb71ecddbd196a5c2a0c7" } # MLDSA
