#                                                 generation tool, and remove unused dependencies: caliptra-drivers and caliptra-image-elf.

[package]
edition = "2021"
name = "caliptra-auth-manifest-app-1x"
version = "0.1.0"

[dependencies]
anyhow.workspace = true
caliptra-auth-man-gen-1x.workspace = true
caliptra-auth-man-types-1x = {workspace = true, features = ["std"]}
caliptra-image-crypto-1x.workspace = true
caliptra-image-gen-1x.workspace = true
caliptra-image-serde-1x.workspace = true
caliptra-image-types-1x = {workspace = true, features = ["std"]}
chrono.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_derive.workspace = true
toml.workspace = true
zerocopy.workspace = true

[features]
default = ["openssl"]
openssl = ["caliptra-image-crypto-1x/openssl"]
rustcrypto = ["caliptra-image-crypto-1x/rustcrypto"]
