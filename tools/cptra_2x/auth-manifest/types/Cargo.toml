[package]
edition = "2021"
name = "caliptra-auth-man-types-2x"
version = "0.1.0"

[lib]
doctest = false

[dependencies]
arbitrary = {workspace = true, optional = true}
bitfield.workspace = true
bitflags.workspace = true
caliptra-error-2x = {workspace = true, default-features = false}
caliptra-image-types-2x = {workspace = true, default-features = false}
caliptra-lms-types-2x.workspace = true
memoffset.workspace = true
zerocopy.workspace = true
zeroize.workspace = true

[features]
default = ["std"]
std = []
