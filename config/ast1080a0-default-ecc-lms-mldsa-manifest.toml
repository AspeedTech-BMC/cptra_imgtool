[manifest_config]
version = 1
flags = 0
security_version = 0
prj_name = "ast1080a0-default"
padding_align_size = 256
padding_out_folder = "out/padding_output"

[vendor_fw_key_config]
ecc_pub_key = "vnd-fw-ecc-pub-key-1.pem"
ecc_priv_key = "vnd-fw-ecc-priv-key-1.pem"
lms_pub_key = "vnd-fw-lms-pub-key-0.pem"
lms_priv_key = "vnd-fw-lms-priv-key-0.pem"
mldsa_pub_key = "vnd-fw-mldsa-pub-key-0.bin"
mldsa_priv_key = "vnd-fw-mldsa-priv-key-0.bin"

[vendor_man_key_config]
ecc_pub_key = "vnd-man-ecc-pub-key.pem"
ecc_priv_key = "vnd-man-ecc-priv-key.pem"
lms_pub_key = "vnd-man-lms-pub-key.pem"
lms_priv_key = "vnd-man-lms-priv-key.pem"
mldsa_pub_key = "vnd-man-mldsa-pub-key.bin"
mldsa_priv_key = "vnd-man-mldsa-priv-key.bin"

[owner_fw_key_config]
ecc_pub_key = "own-fw-ecc-pub-key.pem"
ecc_priv_key = "own-fw-ecc-priv-key.pem"
