mldsa_pub_key = "own-man-mldsa-pub-key.bin"
mldsa_priv_key = "own-man-mldsa-priv-key.bin"

[image_runtime_list]
caliptra_file = "caliptra-fw.bin"
mcu_file = "ssmcu-runtime.bin"

