[package]
edition = "2024"
name = "rust_sign_helper"
version = "0.1.0"

[dependencies]
anyhow = "=1.0.102"
bincode = "=1.3.3"
hex = "=0.4.3"
openssl = {version = "=0.10.76", optional = true}
p384 = {version = "=0.13.1", features = ["pem"]}
sec1 = "=0.7.3"

caliptra-auth-man-gen = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "951209a31c4373658f89e4b1211f3a557731c7d9"}
caliptra-image-crypto = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "951209a31c4373658f89e4b1211f3a557731c7d9"}
caliptra-image-gen = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "951209a31c4373658f89e4b1211f3a557731c7d9"}
caliptra-image-types = {git = "https://github.com/chipsalliance/caliptra-sw", rev = "951209a31c4373658f89e4b1211f3a557731c7d9"}

[features]
default = ["openssl"]
openssl = ["dep:openssl"]

[workspace]
